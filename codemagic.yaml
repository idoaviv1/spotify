workflows:
  ios-unsigned:
    name: Build unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      node: latest
    scripts:
      - name: Install dependencies and build web assets
        script: |
          cd frontend
          npm install
          npm run build
          npx cap sync ios
      - name: Build unsigned .app (Release, generic iOS device)
        script: |
          cd frontend/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
      - name: Package .app into .ipa (unsigned)
        script: |
          set -e
          APP_PATH=$(find frontend/ios/App/build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n1)
          echo "Found app at $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          VERSION=$(node -p "require('./frontend/package.json').version || '1.0.0'")
          STAMP=$(date -u +%Y%m%d-%H%M)
          SHA=$(git rev-parse --short HEAD 2>/dev/null || echo nogit)
          NAME="Homeify-${VERSION}-${STAMP}-${SHA}-unsigned.ipa"
          zip -qr "$NAME" Payload
          cp "$NAME" Homeify.ipa
          cp "$NAME" Homeify-unsigned.ipa
          echo "Built $NAME"
    artifacts:
      - "*.ipa"
