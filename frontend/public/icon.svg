<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#1db954" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Soundwaves -->
  <path d="M120 256 A136 136 0 0 1 392 256" fill="none" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M160 256 A96 96 0 0 1 352 256" fill="none" stroke="url(#neonGrad)" stroke-width="22" stroke-linecap="round" opacity="0.85" />
  <path d="M200 256 A56 56 0 0 1 312 256" fill="none" stroke="url(#neonGrad)" stroke-width="20" stroke-linecap="round" opacity="0.7" />

  <!-- Center Play / Music emblem -->
  <circle cx="256" cy="330" r="48" fill="url(#neonGrad)" filter="url(#neonGlow)" />
  <polygon points="244,310 276,330 244,350" fill="#0a0a0f" />
</svg>
