<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="36%" r="76%">
      <stop offset="0%" stop-color="#161824" />
      <stop offset="60%" stop-color="#0c0d14" />
      <stop offset="100%" stop-color="#07070a" />
    </radialGradient>

    <!-- Bar Neon Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2af575" />
      <stop offset="35%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#129e43" />
    </linearGradient>

    <!-- Ambient Emerald Aura -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(30, 215, 96, 0.42)" />
      <stop offset="50%" stop-color="rgba(30, 215, 96, 0.16)" />
      <stop offset="100%" stop-color="rgba(30, 215, 96, 0)" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="3" />

  <!-- Ambient Glow Behind Bars (No inner card) -->
  <circle cx="256" cy="245" r="160" fill="url(#ambientGlow)" />

  <!-- 4 Music Equalizer Bars -->
  <g filter="url(#neonGlow)">
    <rect x="146" y="226" width="40" height="120" rx="20" fill="url(#barGrad)" />
    <rect x="206" y="126" width="40" height="220" rx="20" fill="url(#barGrad)" />
    <rect x="266" y="181" width="40" height="165" rx="20" fill="url(#barGrad)" />
    <rect x="326" y="151" width="40" height="195" rx="20" fill="url(#barGrad)" />
  </g>
</svg>